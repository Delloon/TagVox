<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TagVox — панель управления</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Экран входа -->
  <section id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-mark">
        <span class="dot"></span>
        <span>TagVox</span>
      </div>
      <h1>Вход в панель</h1>
      <p class="hint" id="login-hint">Проверяю режим входа…</p>
      <div class="field" id="login-error-field" style="display:none;">
        <div class="error-text" id="login-error" style="display:block;"></div>
      </div>

      <a class="btn btn-primary btn-block" id="login-discord-btn" href="/api/auth/discord/login" hidden>
        Войти через Discord
      </a>

      <form id="login-password-form" hidden>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-password-submit">Войти</button>
      </form>
    </div>
  </section>

  <!-- Основное приложение -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-mark">
        <span class="dot"></span>
        <span>TagVox</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="dashboard" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Обзор
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04Z"/></svg>
          Настройки
        </button>
        <button class="nav-item" data-view="phrases" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Фразы и реакции
        </button>
        <button class="nav-item" data-view="voice-commands" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg>
          Голосовые команды
        </button>
        <button class="nav-item" data-view="sounds" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Звуки
        </button>
        <button class="nav-item" data-view="anon" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8.5 9.5c0-1.5 1.5-2.5 3.5-2.5s3.5 1 3.5 2.5c0 1.2-.8 1.8-1.8 2.4-.9.5-1.7 1-1.7 2.1"/><circle cx="12" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg>
          Анонимные сообщения
        </button>
        <button class="nav-item" data-view="modules" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="4" rx="2"/><rect x="3" y="15" width="10" height="4" rx="2"/><circle cx="18" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
          Модули
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-pill" id="sidebar-status">
          <span class="dot"></span>
          <span id="sidebar-status-text">проверка соединения…</span>
        </div>
        <button class="btn btn-ghost btn-block btn-sm" id="logout-btn" type="button">Выйти</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">Обзор</h1>
          <div class="subtitle" id="view-subtitle"></div>
        </div>
      </header>
      <div class="view-root" id="view-root"></div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/phrases.js"></script>
  <script src="js/views/voice-commands.js"></script>
  <script src="js/views/sounds.js"></script>
  <script src="js/views/anon.js"></script>
  <script src="js/views/modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
